- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    property: "1000cr"
  tasks:
  - name: print the vars
    debug:
      msg: "Hi, i got {{ property }} from my father"
    

  - name: print the vars again
    vars:
      property: "10cr"
    debug:
      msg: "Hi, i got {{ property }} from my father"